name: Publish to crates.io
run-name: ${{ inputs.mode }} Super ${{ inputs.version }} (${{ inputs.request }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify OIDC setup or publish the reviewed release
        type: choice
        options: [check, publish]
        default: check
      version:
        description: Reviewed crate version
        required: true
        type: string
      commit:
        description: Full reviewed public commit ID
        required: true
        type: string
      checksums:
        description: Reviewed crate SHA-256 checksums (JSON object)
        required: true
        type: string
      toolchain:
        description: Exact Rust version used to review the archives
        required: true
        type: string
      request:
        description: Unique release request ID for resumable dispatch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_COMMIT: ${{ inputs.commit }}
  RELEASE_CHECKSUMS: ${{ inputs.checksums }}
  RUSTUP_TOOLCHAIN: ${{ inputs.toolchain }}

jobs:
  validate:
    if: github.repository == 'schematic-tech/super' && github.ref == 'refs/heads/main' && github.sha == inputs.commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the reviewed toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Validate the release
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --release --locked -p super-tool
          test "$(target/release/super --version)" = "super $RELEASE_VERSION"
          test "$(target/release/sup --version)" = "super $RELEASE_VERSION"
          python3 .github/publish.py prepare

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the reviewed toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Reproduce the reviewed archives
        run: python3 .github/publish.py prepare
      - name: Request a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - name: Publish the verified crates
        if: inputs.mode == 'publish'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 .github/publish.py publish
