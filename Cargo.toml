[workspace]
members = ["crates/super-types", "crates/super-tool"]
resolver = "3"

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/schematic-tech/super"
documentation = "https://docs.schematic.tech/super/"
rust-version = "1.97"

[workspace.dependencies]
super-types = { version = "0.9.0", path = "crates/super-types" }

anyhow = "1"
base64 = "0.22"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
console = "0.16"
crossterm = { version = "0.29", features = ["event-stream"] }
dialoguer = "0.12"
directories = "6"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
ignore = "0.4"
notify = "8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-vhdl = "1.4"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
